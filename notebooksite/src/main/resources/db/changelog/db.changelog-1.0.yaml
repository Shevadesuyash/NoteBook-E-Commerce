databaseChangeLog:
  - changeSet:
      id: 1
      author: Suyash Shevade
      changes:
        - createTable:
            tableName: brand
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: type
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: SERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: picture_url
                  type: VARCHAR(255)
              - column:
                  name: product_type_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_type
                    references: type(id)
              - column:
                  name: product_brand_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_brand
                    references: brand(id)

