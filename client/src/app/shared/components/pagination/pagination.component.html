<div class="d-flex justify-content-center">
  <div class="row">
    <div class="col-xs-12 col-12">
      <pagination
        (pageChanged)="pageChanged.emit($event)"
        [(ngModel)]="currentPage"
        [itemsPerPage]="pageSize"
        [totalItems]="totalElements"
      ></pagination>
    </div>
  </div>
</div>
